    <script type="text/babel" data-type="module">
      import React, { useMemo, useState } from "react";

      import { Activity, BatteryCharging, Brain, Camera, CheckCircle2, Gauge, HeartPulse, LineChart, Loader2, Search, UploadCloud, AlertTriangle, Table2, UserPlus } from "lucide-react";

      const WEB_APP_URL =
        "https://script.google.com/macros/s/AKfycbxQruttqTU2tRH6op7GgOZB88TimyKPZyJQhibBuR4aL2VZZxjQSugpkhY2d9H-v6ZiCQ/exec";

      function cloudHistoryTestUrl(email) {
        return `${WEB_APP_URL}?action=history&email=${encodeURIComponent(email || "user@example.com")}`;
      }

      function cloudSaveFallbackUrl(payload) {
        return `${WEB_APP_URL}?action=save&payload=${encodeURIComponent(JSON.stringify(payload))}`;
      }

      function todayTaiwanDate() {
        return new Intl.DateTimeFormat("zh-TW", {
          timeZone: "Asia/Taipei",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        })
          .format(new Date())
          .replace(/\//g, "/");
      }

      function normalizeOcrText(text) {
        return text
          .replace(/[|｜]/g, " ")
          .replace(/[０-９]/g, (char) => String.fromCharCode(char.charCodeAt(0) - 65248))
          .replace(/[：﹕]/g, ":")
          .replace(/[，、]/g, " ")
          .replace(/\r/g, "\n");
      }

      function getOcrLines(text) {
        return normalizeOcrText(text)
          .split("\n")
          .map((line) => line.replace(/\s+/g, " ").trim())
          .filter(Boolean);
      }

      function lineHasKeyword(line, keywords) {
        const compact = line.toLowerCase().replace(/\s+/g, "");
        return keywords.some((keyword) => compact.includes(keyword.toLowerCase().replace(/\s+/g, "")));
      }

      function lineHasAllParts(line, parts) {
        const compact = line.toLowerCase().replace(/\s+/g, "");
        return parts.every((part) => compact.includes(part.toLowerCase().replace(/\s+/g, "")));
      }

      function numbersFromText(text, { min = 0, max = 99999 } = {}) {
        return [...normalizeOcrText(text).matchAll(/\d{1,5}(?:\.\d+)?/g)]
          .map((match) => Number(match[0]))
          .filter((value) => Number.isFinite(value) && value >= min && value <= max);
      }

      function stripNonMetricNumbers(text) {
        return normalizeOcrText(text)
          .replace(/\d{1,2}\s*:\s*\d{2}/g, " ")
          .replace(/\d+\s*\/\s*\d+/g, " ");
      }

      function metricNumberCandidates(text, { min = 0, max = 99999 } = {}) {
        const tokens = [...stripNonMetricNumbers(text).matchAll(/\d{1,5}(?:\.\d+)?/g)].map((match) => match[0]);
        const candidates = [];
        const seen = new Set();

        const addCandidate = (raw, score) => {
          const value = Number(raw);
          if (!Number.isFinite(value) || value < min || value > max) return;
          const key = String(Math.round(value));
          if (seen.has(key)) return;
          seen.add(key);
          candidates.push({ value, score, length: String(raw).replace(/\D/g, "").length });
        };

        tokens.forEach((token) => addCandidate(token, token.replace(/\D/g, "").length));

        for (let index = 0; index < tokens.length - 1; index += 1) {
          const left = tokens[index];
          const right = tokens[index + 1];
          if (!/^\d+$/.test(left) || !/^\d+$/.test(right)) continue;
          if (left.length > 2 || right.length > 3 || left.length + right.length > 5) continue;
          addCandidate(left + right, left.length + right.length + 10);
        }

        for (let index = 0; index < tokens.length - 2; index += 1) {
          const group = tokens.slice(index, index + 3);
          if (!group.every((token) => /^\d+$/.test(token) && token.length <= 2)) continue;
          const merged = group.join("");
          if (merged.length > 5) continue;
          addCandidate(merged, merged.length + 12);
        }

        return candidates.sort((a, b) => b.score - a.score || b.length - a.length || b.value - a.value).map((candidate) => candidate.value);
      }

      function firstMetricNumberFromLine(line, options) {
        const candidates = metricNumberCandidates(line, options);
        return candidates.length > 0 ? String(Math.round(candidates[0])) : "";
      }

      function isMetricBoundaryLine(line) {
        return (
          lineHasKeyword(line, [
            "壓力指數",
            "压力指数",
            "壓力等級",
            "压力等级",
            "情緒反應靈活度",
            "情绪反应灵活度",
            "情緒靈活度",
            "情绪灵活度",
            "放鬆指數",
            "放松指数",
            "活力指數",
            "活力指数",
            "平均心跳",
            "平均心率",
            "量測時間",
            "測量時間",
            "测量时间",
            "紀錄異常",
            "记录异常",
            "stress",
            "flexibility",
            "relaxation",
            "vitality",
            "heart rate",
            "duration",
          ]) ||
          lineHasAllParts(line, ["情緒", "反應", "活"]) ||
          lineHasAllParts(line, ["情绪", "反应", "活"])
        );
      }

      function firstNumberNearKeywords(lines, keywords, options) {
        for (let index = 0; index < lines.length; index += 1) {
          if (!lineHasKeyword(lines[index], keywords)) continue;

          const sameLineValue = firstMetricNumberFromLine(lines[index], options);
          if (sameLineValue) return sameLineValue;

          for (let offset = 1; offset < 4; offset += 1) {
            const nextLine = lines[index + offset];
            if (!nextLine || isMetricBoundaryLine(nextLine)) break;
            const nearbyValue = firstMetricNumberFromLine(nextLine, options);
            if (nearbyValue) return nearbyValue;
          }
        }
        return "";
      }

      function firstNumberNearMatcher(lines, matcher, options) {
        for (let index = 0; index < lines.length; index += 1) {
          if (!matcher(lines[index])) continue;

          const sameLineValue = firstMetricNumberFromLine(lines[index], options);
          if (sameLineValue) return sameLineValue;

          for (let offset = 1; offset < 4; offset += 1) {
            const nextLine = lines[index + offset];
            if (!nextLine || isMetricBoundaryLine(nextLine)) break;
            const nearbyValue = firstMetricNumberFromLine(nextLine, options);
            if (nearbyValue) return nearbyValue;
          }
        }
        return "";
      }

      function inferByNumberSequence(text, parsed) {
        const lines = getOcrLines(text);
        const filledMetricLine = (line) => {
          if (parsed.stressIndex && lineHasKeyword(line, ["壓力指數", "压力指数", "壓力", "压力", "stress"])) return true;
          if (
            parsed.emotionalFlexibility &&
            (lineHasKeyword(line, ["情緒反應靈活度", "情绪反应灵活度", "情緒靈活度", "情绪灵活度", "靈活度", "灵活度", "flexibility"]) ||
              lineHasAllParts(line, ["情緒", "反應", "活"]) ||
              lineHasAllParts(line, ["情绪", "反应", "活"]))
          )
            return true;
          if (parsed.relaxationIndex && lineHasKeyword(line, ["放鬆指數", "放松指数", "放鬆", "放松", "relaxation", "relax"])) return true;
          if (parsed.vitalityIndex && lineHasKeyword(line, ["活力指數", "活力指数", "活力", "vitality", "energy", "tp"])) return true;
          if (parsed.averageHeartRate && lineHasKeyword(line, ["平均心跳", "平均心率", "心跳", "心率", "heart rate", "hr"])) return true;
          return false;
        };
        const usedValues = new Set(
          ["stressIndex", "emotionalFlexibility", "relaxationIndex", "vitalityIndex", "averageHeartRate"]
            .map((key) => toNumber(parsed[key]))
            .filter((value) => value !== null),
        );
        const values = lines
          .filter((line) => !/^\d+\s*[).、]/.test(line))
          .filter((line) => !/\d{1,2}:\d{2}/.test(line))
          .filter((line) => !/\d+\s*\/\s*\d+/.test(line))
          .filter((line) => !/20\d{2}[/-]\d{1,2}[/-]\d{1,2}/.test(line))
          .filter((line) => !filledMetricLine(line))
          .flatMap((line) => metricNumberCandidates(line, { min: 0, max: 99999 }))
          .filter((value) => {
            if (!usedValues.has(value)) return true;
            usedValues.delete(value);
            return false;
          });

        const nextValue = (predicate) => {
          const index = values.findIndex(predicate);
          if (index === -1) return "";
          const [value] = values.splice(index, 1);
          return String(Math.round(value));
        };

        return {
          ...parsed,
          stressIndex: parsed.stressIndex || nextValue((value) => value <= 9999),
          emotionalFlexibility: parsed.emotionalFlexibility || nextValue((value) => value <= 100),
          relaxationIndex: parsed.relaxationIndex || nextValue((value) => value <= 100),
          vitalityIndex: parsed.vitalityIndex || nextValue((value) => value >= 100),
        };
      }

      function parseHrvText(text) {
        const lines = getOcrLines(text);
        const joined = lines.join(" ");
        const parsed = {
          stressIndex: firstNumberNearKeywords(lines, ["壓力指數", "压力指数", "壓力", "压力", "stress"], { min: 0, max: 9999 }),
          emotionalFlexibility: firstNumberNearMatcher(
            lines,
            (line) =>
              lineHasKeyword(line, ["情緒反應靈活度", "情绪反应灵活度", "情緒靈活度", "情绪灵活度", "靈活度", "灵活度", "flexibility"]) ||
              lineHasAllParts(line, ["情緒", "反應", "活"]) ||
              lineHasAllParts(line, ["情绪", "反应", "活"]),
            {
              min: 0,
              max: 100,
            },
          ),
          relaxationIndex: firstNumberNearKeywords(lines, ["放鬆指數", "放松指数", "放鬆", "放松", "relaxation", "relax"], { min: 0, max: 100 }),
          vitalityIndex: firstNumberNearKeywords(lines, ["活力指數", "活力指数", "活力", "vitality", "energy", "tp"], { min: 0, max: 99999 }),
          averageHeartRate: firstNumberNearKeywords(lines, ["平均心跳", "平均心率", "心跳", "心率", "heart rate", "hr"], { min: 35, max: 220 }),
          duration: (() => {
            const match = joined.match(/(?:量測時間|測量時間|测量时间|duration|time)?[^0-9]{0,20}(\d{1,2}:\d{2})/i);
            return match ? match[1] : "";
          })(),
        };

        return inferByNumberSequence(text, parsed);
      }

      function preprocessImageForOcr(file) {
        return new Promise((resolve) => {
          const image = new Image();
          const objectUrl = URL.createObjectURL(file);

          image.onload = () => {
            const scale = Math.min(3, Math.max(1.6, 1800 / Math.max(image.width, image.height)));
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(image.width * scale);
            canvas.height = Math.round(image.height * scale);
            const ctx = canvas.getContext("2d", { willReadFrequently: true });
            ctx.imageSmoothingEnabled = true;
            ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            for (let index = 0; index < imageData.data.length; index += 4) {
              const gray = imageData.data[index] * 0.299 + imageData.data[index + 1] * 0.587 + imageData.data[index + 2] * 0.114;
              const boosted = gray > 170 ? 255 : gray < 90 ? 0 : gray * 0.75;
              imageData.data[index] = boosted;
              imageData.data[index + 1] = boosted;
              imageData.data[index + 2] = boosted;
            }
            ctx.putImageData(imageData, 0, 0);
            URL.revokeObjectURL(objectUrl);
            canvas.toBlob((blob) => resolve(blob || file), "image/png");
          };

          image.onerror = () => {
            URL.revokeObjectURL(objectUrl);
            resolve(file);
          };

          image.src = objectUrl;
        });
      }

      function toNumber(value) {
        if (value === null || value === undefined || value === "") return null;
        const parsed = Number(String(value).replace(/[^\d.]/g, ""));
        return Number.isFinite(parsed) ? parsed : null;
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      const INTERVAL_DEFINITIONS = {
        stressIndex: {

          direction: "50-150 常見正常區，過高代表壓力負荷增加",
          source: "Eureka 官方公開說明",
          bands: [
            { range: "< 50", label: "偏低/需留意", tone: "yellow", note: "可能代表長期紓壓訓練，也可能是心率紀錄異常。" },
            { range: "50-150", label: "正常", tone: "green", note: "身心處於相對正常狀態。" },
            { range: "150-500", label: "偏高", tone: "yellow", note: "身心壓力偏大，或可能受過度運動疲勞影響。" },
            { range: "500-900", label: "嚴重", tone: "red", note: "嚴重身心壓力，建議優先恢復並觀察趨勢。" },

          ],
        },

          bands: [
            { range: "46-100", label: "很好", tone: "green", note: "調節彈性佳，通常代表恢復與適應能力較好。" },
            { range: "30-45", label: "普通", tone: "yellow", note: "調節能力尚可，但遇到壓力時可能需要更頻繁休息。" },
            { range: "0-29", label: "稍低", tone: "red", note: "神經調節彈性偏低，留意倦怠與睡眠不足。" },
          ],
        },
        relaxationIndex: {

          bands: [
            { range: "41-100", label: "很好", tone: "green", note: "副交感神經較活躍，身體較接近修復狀態。" },
            { range: "25-40", label: "普通", tone: "yellow", note: "放鬆程度中等，足以支撐日常但恢復深度有限。" },
            { range: "0-24", label: "稍低", tone: "red", note: "身體不易降速，睡前刺激、咖啡因或心理壓力都可能影響。" },
          ],
        },
        vitalityIndex: {
          label: "活力指數",
          direction: "越高越充沛",
          source: "目前採用產品內建判讀規則",
          bands: [
            { range: "2001+", label: "很好", tone: "green", note: "生理能量較充足，適合安排較重要或較耗能的任務。" },
            { range: "1000-2000", label: "普通", tone: "yellow", note: "能量中等，日常可應付，但不宜過度透支。" },
            { range: "0-999", label: "稍低", tone: "red", note: "能量偏低，常見於過勞、恢復不足或身體不適前後。" },
          ],
        },
      };

      function normalizeTrendScore(key, value) {
        const n = toNumber(value);
        if (n === null) return 0;

        if (key === "stressIndex") {
          if (n < 50) return 65;
          if (n <= 150) return clamp(100 - Math.abs(n - 80) * 0.25, 70, 100);
          if (n <= 500) return clamp(70 - ((n - 150) / 350) * 45, 25, 70);
          if (n <= 900) return clamp(25 - ((n - 500) / 400) * 20, 5, 25);
          return 0;
        }

        if (key === "vitalityIndex") return clamp((n / 2500) * 100, 0, 100);
        return clamp(n, 0, 100);
      }

      function intervalRadarPosition(key, value) {
        const evaluation = evaluateMetric(key, value);
        return {
          green: 92,
          yellow: 58,
          red: 28,
          gray: 0,
        }[evaluation.tone];
      }

      function metricToneColor(tone) {
        return {
          green: "border-emerald-200 bg-emerald-50 text-emerald-700",
          yellow: "border-amber-200 bg-amber-50 text-amber-700",
          red: "border-rose-200 bg-rose-50 text-rose-700",
          gray: "border-slate-200 bg-slate-50 text-slate-500",
        }[tone];
      }

      function RadarChart({ points }) {
        const size = 260;
        const center = size / 2;
        const radius = 88;
        const axes = points.map((point, index) => {
          const angle = -Math.PI / 2 + (Math.PI * 2 * index) / points.length;
          const x = center + Math.cos(angle) * radius;
          const y = center + Math.sin(angle) * radius;
          const labelX = center + Math.cos(angle) * (radius + 31);
          const labelY = center + Math.sin(angle) * (radius + 31);
          const valueRadius = radius * (point.position / 100);
          return {
            ...point,
            angle,
            x,
            y,
            labelX,
            labelY,
            pointX: center + Math.cos(angle) * valueRadius,
            pointY: center + Math.sin(angle) * valueRadius,
          };
        });
        const polygon = axes.map((axis) => `${axis.pointX},${axis.pointY}`).join(" ");
        const rings = [0.25, 0.5, 0.75, 1].map((scale) =>
          axes
            .map((axis) => {
              const ringRadius = radius * scale;
              return `${center + Math.cos(axis.angle) * ringRadius},${center + Math.sin(axis.angle) * ringRadius}`;
            })
            .join(" "),
        );

        return (
          <div className="grid gap-5 md:grid-cols-[280px_1fr] md:items-center">
            <svg viewBox={`0 0 ${size} ${size}`} className="mx-auto h-72 w-full max-w-72" role="img" aria-label="HRV 狀態區間圖">
              {rings.map((ring) => (
                <polygon key={ring} points={ring} fill="none" stroke="#cbd5e1" strokeWidth="1" />
              ))}
              {axes.map((axis) => (
                <line key={axis.key} x1={center} y1={center} x2={axis.x} y2={axis.y} stroke="#cbd5e1" strokeWidth="1" />
              ))}
              <polygon points={polygon} fill="rgba(15, 23, 42, 0.10)" stroke="#334155" strokeWidth="3" />
              {axes.map((axis) => (
                <g key={axis.key}>
                  <circle cx={axis.pointX} cy={axis.pointY} r="4.5" fill={axis.color} />
                  <text x={axis.labelX} y={axis.labelY} textAnchor="middle" dominantBaseline="middle" fill={axis.color} className="text-[11px] font-bold">
                    {axis.shortLabel}
                  </text>
                </g>
              ))}
            </svg>
            <div className="grid gap-3">
              {points.map((point) => (
                <div key={point.key} className={`rounded-2xl border p-4 ${metricToneColor(point.evaluation.tone)}`}>
                  <div className="flex items-center justify-between gap-3">
                    <p className="text-sm font-bold text-slate-700">{point.label}</p>
                    <p className="text-sm font-bold">{point.evaluation.level}</p>
                  </div>
                  <p className="mt-2 text-xs text-slate-500">原始值：{point.raw || "尚未輸入"}</p>
                </div>
              ))}
            </div>
          </div>
        );
      }

      const BRSR_ITEMS = [
        { key: "sleep", label: "睡眠困難", short: "睡眠" },
        { key: "anxiety", label: "感覺緊張不安", short: "焦慮" },
        { key: "anger", label: "覺得容易苦惱或動怒", short: "易怒" },
        { key: "depression", label: "感覺憂鬱、心情低落", short: "低落" },
        { key: "inferiority", label: "覺得比不上別人", short: "自卑" },
      ];

      const BRSR_SCORE_LABELS = ["完全沒有", "輕微", "中等程度", "厲害", "非常厲害"];

      function evaluateBrsr(brsr) {
        const total = BRSR_ITEMS.reduce((sum, item) => sum + Number(brsr[item.key] || 0), 0);
        const suicide = Number(brsr.suicide || 0);

        if (total >= 15 || suicide >= 2) {
          return {
            total,
            suicide,
            level: "重度或高風險",
            tone: "red",
            meaning: "分數顯示心理困擾較高，建議盡快找專業人員或可信任的人討論目前狀態。",
          };
        }
        if (total >= 10) {
          return {
            total,
            suicide,
            level: "中度困擾",
            tone: "yellow",
            meaning: "近期壓力或情緒負荷偏高，建議安排支持、休息與進一步關懷。",
          };
        }
        if (total >= 6) {
          return {
            total,
            suicide,
            level: "輕度困擾",
            tone: "yellow",
            meaning: "已有一些身心壓力訊號，建議搭配 HRV 趨勢觀察並調整生活負荷。",
          };
        }
        return {
          total,
          suicide,
          level: "一般範圍",
          tone: "green",
          meaning: "目前主觀困擾分數較低，可持續追蹤睡眠、壓力事件與 HRV 趨勢。",
        };
      }

      function TrendChart({ records }) {
        const metrics = [
          { key: "stressIndex", label: "壓力穩定", color: "#ef4444", normalize: (value) => normalizeTrendScore("stressIndex", value) },
          { key: "emotionalFlexibility", label: "情緒韌性", color: "#8b5cf6", normalize: (value) => normalizeTrendScore("emotionalFlexibility", value) },
          { key: "relaxationIndex", label: "放鬆恢復", color: "#10b981", normalize: (value) => normalizeTrendScore("relaxationIndex", value) },
          { key: "vitalityIndex", label: "生理活力", color: "#f97316", normalize: (value) => normalizeTrendScore("vitalityIndex", value) },
          { key: "brsrTotal", label: "BSRS", color: "#0f172a", normalize: (value) => clamp(100 - (toNumber(value) || 0) * 5, 0, 100) },
        ];
        const width = 640;
        const height = 260;
        const padding = 34;
        const plotWidth = width - padding * 2;
        const plotHeight = height - padding * 2;
        const sorted = [...records].sort((a, b) => String(a.measureDate || a.savedAt || "").localeCompare(String(b.measureDate || b.savedAt || "")));
        const xFor = (index) => padding + (sorted.length <= 1 ? plotWidth / 2 : (index / (sorted.length - 1)) * plotWidth);
        const yFor = (score) => padding + (1 - score / 100) * plotHeight;

        return (
          <div>
            <svg viewBox={`0 0 ${width} ${height}`} className="h-72 w-full" role="img" aria-label="歷史趨勢圖">
              {[0, 25, 50, 75, 100].map((score) => (
                <g key={score}>
                  <line x1={padding} y1={yFor(score)} x2={width - padding} y2={yFor(score)} stroke="#e2e8f0" strokeWidth="1" />
                  <text x="6" y={yFor(score) + 4} className="fill-slate-400 text-[11px]">
                    {score}
                  </text>
                </g>
              ))}
              {metrics.map((metric) => {
                const points = sorted
                  .map((record, index) => {
                    const value = toNumber(record[metric.key]);
                    if (value === null) return null;
                    return `${xFor(index)},${yFor(metric.normalize(value))}`;
                  })
                  .filter(Boolean);
                if (points.length === 0) return null;
                return <polyline key={metric.key} points={points.join(" ")} fill="none" stroke={metric.color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />;
              })}
            </svg>
            <div className="flex flex-wrap gap-2">
              {metrics.map((metric) => (
                <span key={metric.key} className="rounded-full bg-slate-100 px-3 py-1 text-xs font-bold text-slate-600">
                  <span className="mr-1 inline-block h-2 w-2 rounded-full" style={{ backgroundColor: metric.color }} />
                  {metric.label}
                </span>
              ))}
            </div>
            <div className="mt-4 max-h-72 overflow-auto rounded-2xl border border-slate-200">
              {sorted.map((record) => (
                <div key={`${record.email}-${record.measureDate}-${record.savedAt}`} className="grid gap-1 border-b border-slate-100 p-3 text-xs last:border-b-0 md:grid-cols-[110px_1fr]">
                  <p className="font-bold text-slate-700">{record.measureDate || "未填日期"}</p>
                  <p className="text-slate-500">
                    壓力 {record.stressIndex || "-"} / 情緒 {record.emotionalFlexibility || "-"} / 放鬆 {record.relaxationIndex || "-"} / 活力 {record.vitalityIndex || "-"} / BSRS {record.brsrTotal ?? "-"}
                  </p>
                </div>
              ))}
            </div>
          </div>
        );
      }

      function evaluateMetric(key, value) {
        const n = toNumber(value);
        if (n === null) {
          return {
            level: "尚未輸入",
            tone: "gray",
            meaning: "等待 OCR 或手動輸入後判讀。",
          };
        }

        const rules = {
          stressIndex: [
            [n < 50, "偏低/需留意", "yellow", "可能代表長期紓壓訓練，也可能是心率紀錄異常，建議搭配訊號品質確認。"],
            [n <= 150, "正常", "green", "壓力負荷在常見正常範圍，交感神經活化程度較穩。"],
            [n <= 500, "偏高", "yellow", "身心壓力可能偏大，或受過度運動後疲勞影響。"],
            [true, "嚴重偏高", "red", "高度緊繃狀態，若連續多次出現，應優先安排恢復。"],
          ],
          emotionalFlexibility: [
            [n >= 46, "很好", "green", "調節彈性佳，通常代表恢復與適應能力較好。"],
            [n >= 30, "普通", "yellow", "調節能力尚可，但遇到壓力時可能需要更頻繁休息。"],
            [true, "稍低", "red", "神經調節彈性偏低，可能與倦怠、睡眠不足或累積壓力有關。"],
          ],
          relaxationIndex: [
            [n >= 41, "很好", "green", "副交感神經較活躍，身體較接近修復狀態。"],
            [n >= 25, "普通", "yellow", "放鬆程度中等，足以支撐日常但恢復深度有限。"],
            [true, "稍低", "red", "身體不易降速，睡前刺激、咖啡因或心理壓力都可能影響。"],
          ],
          vitalityIndex: [
            [n > 2000, "很好", "green", "生理能量較充足，適合安排較重要或較耗能的任務。"],
            [n >= 1000, "普通", "yellow", "能量中等，日常可應付，但不宜過度透支。"],
            [true, "稍低", "red", "能量偏低，常見於過勞、恢復不足或身體不適前後。"],
          ],
        };

        const matched = rules[key].find(([condition]) => condition);
        return {
          level: matched[1],
          tone: matched[2],
          meaning: matched[3],
        };
      }

      function diagnoseHrv(form) {
        const stress = toNumber(form.stressIndex);
        const flexibility = toNumber(form.emotionalFlexibility);
        const relaxation = toNumber(form.relaxationIndex);
        const vitality = toNumber(form.vitalityIndex);
        const heartRate = toNumber(form.averageHeartRate);

        if ([stress, flexibility, relaxation, vitality].every((value) => value === null)) {
          return {
            title: "等待數據",
            level: "尚未判讀",
            tone: "gray",
            observation: "上傳截圖或手動輸入四項核心指標後，系統會產生狀態摘要。",
            recommendation: "建議在相近時間、相近姿勢與安靜環境測量，單次數據以參考為主。",
            checklist: ["確認截圖數值是否辨識正確。"],
          };
        }

        const rules = [
          {
            match: vitality !== null && stress !== null && vitality < 1000 && stress > 150,
            title: "紅色警戒",
            level: "能量枯竭型",
            tone: "red",
            observation: "身體可能處於低能量但高緊繃的負債運轉狀態。",
            recommendation: "今天優先停止加壓，避免再用咖啡因硬撐；安排 20 分鐘以上安靜躺休或提早睡眠。",
            checklist: ["取消非必要高強度訓練或熬夜工作。", "補水與正常進食，觀察是否伴隨頭暈、胸悶或明顯不適。"],
          },
          {
            match: stress !== null && relaxation !== null && stress > 130 && relaxation < 25,
            title: "煞車失靈",
            level: "高能耗損型",
            tone: "red",
            observation: "壓力油門偏強、放鬆煞車偏弱，神經系統可能不容易關機。",
            recommendation: "做 5 到 10 分鐘慢呼吸，優先嘗試約每分鐘 6 次、吐氣略長於吸氣；睡前降低螢幕、工作訊息與刺激性內容。",
            checklist: ["晚間避免劇烈運動與大量咖啡因。", "若連續多日如此，先調整睡眠與工作負荷。"],
          },
          {
            match: vitality !== null && flexibility !== null && stress !== null && vitality > 2500 && flexibility > 50 && stress < 100,
            title: "黃金狀態",
            level: "高能韌性型",
            tone: "green",
            observation: "生理能量、情緒調節與壓力負荷組合良好，身心彈性佳。",
            recommendation: "適合安排重要決策、創造性工作或品質較高的訓練；仍保留收操與睡眠，避免因狀態好而過度透支。",
            checklist: ["把今天的睡眠、運動、飲食與測量時間記下來，作為未來基準。"],
          },
          {
            match: stress !== null && vitality !== null && relaxation !== null && stress < 70 && vitality < 1200 && relaxation < 25,
            title: "假性平穩",
            level: "過勞前兆",
            tone: "yellow",
            observation: "壓力指數雖低，但可能是能量不足導致反應變鈍，並不一定代表真正放鬆。",
            recommendation: "採取預防性休息，補足營養與睡眠；今天避免高耗能任務，觀察明後天是否回升。",
            checklist: ["用主觀疲勞、睡眠時數與精神清晰度交叉確認。"],
          },
        ];

        const matched = rules.find((rule) => rule.match);
        const metricWarnings = [];
        if (stress !== null && stress > 150) metricWarnings.push("壓力指數偏高，先降低刺激與任務密度。");
        if (relaxation !== null && relaxation < 25) metricWarnings.push("放鬆指數偏低，安排慢呼吸、伸展或安靜躺休。");
        if (vitality !== null && vitality < 1000) metricWarnings.push("活力指數偏低，今天以恢復、睡眠與補水為優先。");
        if (flexibility !== null && flexibility < 30) metricWarnings.push("情緒靈活度偏低，避免連續切換高壓任務。");
        if (heartRate !== null && (heartRate >= 100 || heartRate < 50)) metricWarnings.push("平均心跳落在需留意範圍，請搭配身體感受與平日基準判斷。");

        if (matched) {
          return {
            ...matched,
            checklist: [...matched.checklist, ...metricWarnings.filter((item) => !matched.checklist.includes(item))],
          };
        }

        if (metricWarnings.length > 0) {
          return {
            title: "局部失衡",
            level: "需恢復調整",
            tone: "yellow",
            observation: "尚未符合特定綜合型態，但已有一項或多項指標偏離理想區間。",
            recommendation: "今天把目標改成降低負荷與穩定節律：補水、規律進食、短暫散步、慢呼吸，並避免用單次數據做重大判斷。",
            checklist: metricWarnings,
          };
        }

        return {
          title: "穩定可用",
          level: "一般狀態",
          tone: "green",
          observation: "四項核心指標未出現明顯警訊，整體狀態可支撐一般日常活動。",
          recommendation: "維持規律作息，並累積至少 7 天個人基準線；若主觀感受與數據不一致，以身體感受與趨勢為優先。",
          checklist: ["記錄測量前的睡眠、咖啡因、運動與壓力事件，方便後續比較。"],
        };
      }

      function averageHistory(records, key) {
        const values = records.map((record) => toNumber(record[key])).filter((value) => value !== null);
        if (values.length === 0) return null;
        return values.reduce((sum, value) => sum + value, 0) / values.length;
      }

      function compareToBaseline(current, baseline, lowerIsBetter = false) {
        const value = toNumber(current);
        if (value === null || baseline === null) return "尚無足夠資料";
        const diff = value - baseline;
        const percent = baseline === 0 ? 0 : Math.round((diff / baseline) * 100);
        if (Math.abs(percent) < 5) return "接近 7 筆基準";
        const better = lowerIsBetter ? diff < 0 : diff > 0;
        return `${better ? "優於" : "低於"}基準 ${Math.abs(percent)}%`;
      }

      async function runOcr(file) {
        if (!window.Tesseract) {
          throw new Error("OCR 模組尚未載入，請確認網路可連線至 jsDelivr。");
        }

        const processedFile = await preprocessImageForOcr(file);
        const result = await window.Tesseract.recognize(processedFile, "chi_tra+eng", {
          logger: () => {},
          tessedit_pageseg_mode: "6",
          preserve_interword_spaces: "1",
        });
        return result.data.text || "";
      }

            delete window[callbackName];
            script.remove();

          window[callbackName] = (result) => {
            cleanup();
            setIsLoadingCloudHistory(false);

            if (!result || result.ok === false) {
              setMessage(`雲端歷史查詢失敗：${result?.error || "未知錯誤"}`);

            setHistorySource("cloud");
            setMessage(`已從 Google Sheet 載入 ${records.length} 筆紀錄。`);

            setIsLoadingCloudHistory(false);

          };

          script.src = `${WEB_APP_URL}?action=history&email=${encodeURIComponent(target)}&callback=${callbackName}`;

            setMessage("已送出至 Google Sheet。若表格沒有新增資料，請檢查 Apps Script 部署權限與 SHEET_NAME。");
          } catch (error) {
            setMessage("儲存失敗：" + (error.message || "未知錯誤"));
          } finally {
            setIsSaving(false);
          }
        }

        return (
          <div className="min-h-screen bg-stone-100 px-4 py-6 text-slate-700">
            <div className="mx-auto max-w-3xl space-y-4">
              <motion.div initial={{ opacity: 0, y: 8 }} animate={{ opacity: 1, y: 0 }} className="rounded-[2rem] bg-white p-6 shadow-sm">
                <div className="mb-5 flex items-center gap-3">
                  <div className="rounded-2xl bg-orange-100 p-3 text-orange-500">
                    <Table2 size={24} />
                  </div>
                  <div>
                    <h1 className="text-2xl font-bold text-slate-800">HRV 測量截圖紀錄</h1>
                    <p className="text-sm text-slate-500">上傳截圖後自動辨識，確認後寫入 Google Sheet</p>
                  </div>
                </div>

                <label
                  onDragOver={(e) => {
                    e.preventDefault();
                    setDragging(true);
                  }}
                  onDragLeave={() => setDragging(false)}
                  onDrop={(e) => {
                    e.preventDefault();
                    setDragging(false);
                    handleFile(e.dataTransfer.files?.[0]);
                  }}
                  className={`block cursor-pointer rounded-3xl border-2 border-dashed p-8 text-center transition ${
                    dragging ? "border-orange-400 bg-orange-50" : "border-slate-300 bg-slate-50"
                  }`}
                >
                  <input type="file" accept="image/*" className="hidden" onChange={(e) => handleFile(e.target.files?.[0])} />
                  <div className="mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-2xl bg-white shadow-sm">
                    {isReading ? <Loader2 className="animate-spin text-orange-500" /> : <Camera className="text-orange-500" />}
                  </div>
                  <p className="font-semibold text-slate-800">點擊或拖曳截圖至此</p>
                  <p className="mt-1 text-sm text-slate-500">本機辨識；送出時只寫入確認後的數值</p>
                </label>

                {imageUrl && <img src={imageUrl} alt="preview" className="mt-4 max-h-80 w-full rounded-3xl bg-black/5 object-contain" />}
              </motion.div>

              <Panel
                title="使用者資訊"
                subtitle={showProfileDetails ? "維護帳號與基本資料" : "快速量測只需 email 與日期"}
                icon={UserPlus}
                defaultOpen
                badge={
                  <button
                    type="button"
                    onClick={(event) => {
                      event.preventDefault();
                      setShowProfileDetails((prev) => !prev);
                    }}
                    className={`rounded-2xl p-3 transition ${showProfileDetails ? "bg-orange-100 text-orange-600" : "bg-slate-100 text-slate-400"}`}
                    title="開合基本資料"
                  >
                    <UserPlus size={24} />
                  </button>
                }
              >
                <div className="grid gap-4 md:grid-cols-2">
                  <div>
                    <div className="mb-2 flex items-center justify-between gap-3">
                      <label className="block text-xs font-semibold uppercase text-slate-500">Email</label>
                      {!showProfileDetails && <span className="text-xs font-semibold text-slate-400">單次使用可不建檔</span>}
                    </div>
                    <input
                      value={email}
                      list="common-email-list"
                      onChange={(e) => {
                        const nextEmail = e.target.value;
                        setEmail(nextEmail);
                        const matched = savedProfiles.find((item) => item.email.toLowerCase() === nextEmail.trim().toLowerCase());
                        if (matched) selectProfile(matched);
                      }}
                      className="w-full rounded-2xl border border-slate-300 px-4 py-3 outline-none focus:border-orange-400"
                    />
                    <datalist id="common-email-list">
                      {savedProfiles.map((item) => (
                        <option key={item.email} value={item.email}>
                          {item.name || item.email}
                        </option>
                      ))}
                    </datalist>
                    {savedProfiles.length > 0 && (
                      <div className="mt-3 flex flex-wrap gap-2">
                        {savedProfiles.map((item) => (
                          <button key={item.email} type="button" onClick={() => selectProfile(item)} className="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-600">
                            {item.name ? `${item.name}｜${item.email}` : item.email}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                  <div>
                    <label className="mb-2 block text-xs font-semibold text-slate-500">量測日期</label>
                    <input value={measureDate} onChange={(e) => setMeasureDate(e.target.value)} className="w-full rounded-2xl border border-slate-300 px-4 py-3 outline-none focus:border-orange-400" />
                  </div>
                  {showProfileDetails && (
                    <>
                      <div>
                        <label className="mb-2 block text-xs font-semibold text-slate-500">姓名（暱稱）</label>
                        <input
                          value={profile.name}
                          onChange={(e) => setProfile((prev) => ({ ...prev, name: e.target.value }))}
                          placeholder="例如：小安"
                          className="w-full rounded-2xl border border-slate-300 px-4 py-3 outline-none focus:border-orange-400"
                        />
                      </div>
                      <div>
                        <label className="mb-2 block text-xs font-semibold text-slate-500">出生年月日</label>
                        <input
                          type="date"
                          value={profile.birthDate}
                          onChange={(e) => setProfile((prev) => ({ ...prev, birthDate: e.target.value }))}
                          className="w-full rounded-2xl border border-slate-300 px-4 py-3 outline-none focus:border-orange-400"
                        />
                      </div>
                      <div className="md:col-span-2">
                        <label className="mb-2 block text-xs font-semibold text-slate-500">性別</label>
                        <div className="grid grid-cols-2 gap-2 md:grid-cols-4">
                          {["女性", "男性", "非二元/其他", "未填"].map((item) => (
                            <button
                              key={item}
                              type="button"
                              onClick={() => setProfile((prev) => ({ ...prev, gender: item === "未填" ? "" : item }))}
                              className={`rounded-2xl px-4 py-3 text-sm font-bold transition ${
                                (profile.gender || "未填") === item ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-600 hover:bg-slate-200"
                              }`}
                            >
                              {item}
                            </button>
                          ))}
                        </div>
                      </div>
                      <div className="md:col-span-2">
                        <button type="button" onClick={() => saveProfile()} className="flex w-full items-center justify-center gap-2 rounded-2xl bg-orange-500 px-4 py-3 text-sm font-bold text-white">
                          <UserPlus size={16} /> 儲存基本資料
                        </button>
                      </div>
                    </>
                  )}
                </div>
              </Panel>

              <Panel
                title="辨識結果"
                subtitle="確認 OCR 數值，必要時手動修正"
                icon={CheckCircle2}
                defaultOpen
                badge={<span className="hidden items-center gap-1 text-xs font-semibold text-emerald-600 sm:flex"><CheckCircle2 size={14} /> 綠色＝可手動修正後儲存</span>}
              >
                <div className="grid gap-3 md:grid-cols-2">
                  {metricCards.map(({ label, key, icon: Icon }) => {
                    const evaluation = ["averageHeartRate", "duration"].includes(key) ? null : evaluateMetric(key, form[key]);

                    return (
                      <div key={key} className="rounded-2xl bg-slate-100 p-4">
                        <div className="mb-2 flex items-center justify-between gap-2">
                          <label className="block text-xs font-bold text-slate-500">{label}</label>
                          <Icon size={16} className="text-slate-400" />
                        </div>
                        <input
                          value={form[key]}
                          onChange={(e) => setForm((prev) => ({ ...prev, [key]: e.target.value }))}
                          placeholder="—"
                          className="w-full bg-transparent text-2xl font-bold text-slate-800 outline-none"
                        />
                        {evaluation && (
                          <div className={`mt-3 rounded-xl border px-3 py-2 text-xs ${metricToneColor(evaluation.tone)}`}>
                            <p className="font-bold">{evaluation.level}</p>
                            <p className="mt-1 leading-relaxed">{evaluation.meaning}</p>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>

                <details className="mt-5 text-sm text-slate-500">
                  <summary className="cursor-pointer text-center">顯示 OCR 原始文字</summary>
                  <textarea
                    value={ocrText}
                    onChange={(e) => setOcrText(e.target.value)}
                    placeholder="尚未辨識。若 OCR 有抓到文字但欄位沒填入，可在這裡修正文字後重新解析。"
                    className="mt-3 min-h-40 w-full rounded-2xl bg-slate-900 p-4 font-mono text-xs text-slate-100 outline-none"
                  />
                  <button
                    type="button"
                    onClick={() => applyParsedText(ocrText)}
                    className="mt-3 w-full rounded-full bg-slate-800 px-4 py-3 text-sm font-bold text-white transition hover:bg-slate-700"
                  >
                    重新解析 OCR 文字
                  </button>
                </details>
              </Panel>

              <Panel
                title="狀態區間圖"
                subtitle="依原始區間呈現四項狀態，不作精準分數解讀。"
                icon={Activity}
                badge={<span className="rounded-full bg-slate-100 px-3 py-1 text-xs font-bold text-slate-600">區間判讀</span>}
              >
                <RadarChart points={radarPoints} />
              </Panel>

              <Panel title="區間查詢" subtitle="壓力指數採 Eureka 官網公開區間；其餘三項目前採用此工具內建判讀規則。" icon={Gauge}>
                <div className="space-y-3">
                  {intervalRows.map((row) => (
                    <details key={row.key} className={`rounded-2xl border p-4 ${metricToneColor(row.evaluation.tone)}`}>
                      <summary className="cursor-pointer list-none">
                        <div className="flex flex-wrap items-center justify-between gap-3">
                          <div>
                            <p className="text-sm font-bold text-slate-900">{row.label}</p>
                            <p className="mt-1 text-xs text-slate-500">{row.direction}</p>
                          </div>
                          <div className="text-right">
                            <p className="text-xl font-bold text-slate-900">{row.value || "—"}</p>
                            <p className="text-xs font-bold">{row.evaluation.level}</p>
                          </div>
                        </div>
                      </summary>
                      <div className="mt-4 grid gap-2">
                        {row.bands.map((band) => (
                          <div key={`${row.key}-${band.range}`} className={`rounded-xl border px-3 py-2 text-xs ${metricToneColor(band.tone)}`}>
                            <div className="flex items-center justify-between gap-3">
                              <span className="font-bold">{band.range}</span>
                              <span className="font-bold">{band.label}</span>
                            </div>
                            <p className="mt-1 leading-relaxed text-slate-600">{band.note}</p>
                          </div>
                        ))}
                        <p className="pt-1 text-xs text-slate-400">來源：{row.source}</p>
                      </div>
                    </details>
                  ))}
                </div>
              </Panel>

              <Panel
                title="系統觀察"
                subtitle={`${assessment.title}｜${assessment.level}`}
                icon={AlertTriangle}
                defaultOpen
                tone={assessment.tone}
                badge={<span className="rounded-full bg-white/70 px-3 py-1 text-xs font-bold text-slate-700">{assessment.title}</span>}
              >
                <div className="space-y-3 text-sm leading-relaxed text-slate-700">
                  <p>
                    <span className="font-bold text-slate-900">判讀：</span>
                    {assessment.observation}
                  </p>
                  <p>
                    <span className="font-bold text-slate-900">建議：</span>
                    {assessment.recommendation}
                  </p>
                  <div className="grid gap-2 md:grid-cols-2">
                    {assessment.checklist.map((item) => (
                      <div key={item} className="rounded-xl bg-white/70 px-3 py-2">
                        {item}
                      </div>
                    ))}
                  </div>
                </div>
              </Panel>

              <Panel
                title="7 筆本機基準線"
                subtitle="需要比較個人趨勢時再展開"
                icon={LineChart}
                badge={<span className="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-500">目前儲存 {history.length} 筆</span>}
              >
                <div className="mt-4 grid gap-3 md:grid-cols-2">
                  {baselineRows.map((row) => (
                    <div key={row.label} className="rounded-2xl bg-slate-100 p-4">
                      <p className="text-xs font-bold text-slate-500">{row.label}</p>
                      <div className="mt-2 flex items-end justify-between gap-3">
                        <p className="text-xl font-bold text-slate-800">{row.value}</p>
                        <p className="text-right text-xs font-semibold text-slate-500">{row.comparison}</p>
                      </div>
                    </div>
                  ))}
                </div>
                <p className="mt-4 text-xs leading-relaxed text-slate-400">
                  HRV 判讀適合看個人趨勢。這裡使用本瀏覽器最近 7 筆已儲存資料做參考；若換裝置或清除瀏覽器資料，基準線會重新累積。
                </p>
              </Panel>

              <Panel
                title="BSRS 心情溫度計"
                subtitle="請回想最近一週的主觀感受，0 代表完全沒有，4 代表非常厲害。"
                icon={Brain}
                badge={
                  <div className={`rounded-2xl border px-4 py-3 text-right ${metricToneColor(brsrAssessment.tone)}`}>
                    <p className="text-xs font-bold">總分</p>
                    <p className="text-2xl font-bold text-slate-900">{brsrAssessment.total}</p>
                    <p className="text-xs font-bold">{brsrAssessment.level}</p>
                  </div>
                }
              >
                <div className="space-y-4">
                  {BRSR_ITEMS.map((item) => (
                    <div key={item.key} className="rounded-2xl bg-slate-100 p-4">
                      <div className="mb-3 flex items-center justify-between gap-3">
                        <label className="text-sm font-bold text-slate-700">{item.label}</label>
                        <span className="rounded-full bg-white px-3 py-1 text-xs font-bold text-slate-600">{BRSR_SCORE_LABELS[brsr[item.key]]}</span>
                      </div>
                      <div className="grid grid-cols-5 gap-2">
                        {[0, 1, 2, 3, 4].map((score) => (
                          <button
                            key={`${item.key}-${score}`}
                            type="button"
                            onClick={() => updateBrsrScore(item.key, score)}
                            className={`rounded-xl px-2 py-2 text-sm font-bold transition ${
                              brsr[item.key] === score ? "bg-slate-900 text-white" : "bg-white text-slate-500 hover:bg-slate-200"
                            }`}
                          >
                            {score}
                          </button>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>

                <div className="mt-4 rounded-2xl bg-slate-100 p-4">
                  <div className="mb-3 flex items-center justify-between gap-3">
                    <label className="text-sm font-bold text-slate-700">有自殺的想法</label>
                    <span className="rounded-full bg-white px-3 py-1 text-xs font-bold text-slate-600">{BRSR_SCORE_LABELS[brsr.suicide]}</span>
                  </div>
                  <div className="grid grid-cols-5 gap-2">
                    {[0, 1, 2, 3, 4].map((score) => (
                      <button
                        key={`suicide-${score}`}
                        type="button"
                        onClick={() => updateBrsrScore("suicide", score)}
                        className={`rounded-xl px-2 py-2 text-sm font-bold transition ${brsr.suicide === score ? "bg-slate-900 text-white" : "bg-white text-slate-500 hover:bg-slate-200"}`}
                      >
                        {score}
                      </button>
                    ))}
                  </div>
                </div>

                <div className={`mt-4 rounded-2xl border p-4 text-sm leading-relaxed ${metricToneColor(brsrAssessment.tone)}`}>
                  <p className="font-bold text-slate-900">{brsrAssessment.level}</p>
                  <p className="mt-1 text-slate-700">{brsrAssessment.meaning}</p>
                </div>
              </Panel>

              <Panel title="歷史趨勢區" subtitle="輸入 email 查詢本機或 Google Sheet 紀錄" icon={LineChart}>
                <div className="mt-4 flex flex-col gap-3 md:flex-row">
                  <input
                    value={historyEmail}
                    list="common-email-list"
                    onChange={(e) => {
                      setHistoryEmail(e.target.value);
                      setHistorySource("local");
                    }}
                    placeholder="輸入欲查看的 email"
                    className="min-w-0 flex-1 rounded-2xl border border-slate-300 px-4 py-3 outline-none focus:border-orange-400"
                  />
                  <button
                    type="button"
                    onClick={() => {
                      setHistoryEmail(email);
                      setHistorySource("local");
                    }}
                    className="flex items-center justify-center gap-2 rounded-2xl bg-slate-900 px-5 py-3 text-sm font-bold text-white"
                  >
                    <Search size={16} /> 查目前帳號
                  </button>
                  <button
                    type="button"
                    onClick={loadCloudHistory}
                    disabled={isLoadingCloudHistory}
                    className="flex items-center justify-center gap-2 rounded-2xl bg-orange-500 px-5 py-3 text-sm font-bold text-white disabled:bg-orange-200"
                  >
                    {isLoadingCloudHistory ? <Loader2 size={16} className="animate-spin" /> : <Search size={16} />}
                    查 Google Sheet
                  </button>
                </div>
                <p className="mt-3 text-xs leading-relaxed text-slate-400">
                  若查詢失敗，請先確認 Apps Script 已部署為「任何人皆可存取」。可用
                  <a className="mx-1 font-bold text-orange-600 underline" href={cloudHistoryTestUrl(historyEmail || email)} target="_blank" rel="noreferrer">
                    測試連結
                  </a>
                  檢查是否回傳 JSON；若看到 403，就是部署權限尚未開放。
                </p>
                {historyEmail.trim() && (
                  <div className="mt-3 flex gap-2">
                    <button
                      type="button"
                      onClick={() => setHistorySource("local")}
                      className={`rounded-full px-3 py-1 text-xs font-bold ${historySource === "local" ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500"}`}
                    >
                      本機 {filteredHistory.length} 筆
                    </button>
                    <button
                      type="button"
                      onClick={() => setHistorySource("cloud")}
                      className={`rounded-full px-3 py-1 text-xs font-bold ${historySource === "cloud" ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500"}`}
                    >
                      Google Sheet {cloudHistory.length} 筆
                    </button>
                  </div>
                )}
                <div className="mt-4">
                  {!historyEmail.trim() ? (
                    <p className="rounded-2xl bg-slate-100 p-4 text-sm text-slate-500">請輸入 email 後查看趨勢。</p>
                  ) : displayedHistory.length === 0 ? (
                    <p className="rounded-2xl bg-slate-100 p-4 text-sm text-slate-500">
                      目前{historySource === "cloud" ? " Google Sheet" : "本機"}沒有這個 email 的儲存紀錄。
                    </p>
                  ) : (
                    <TrendChart records={displayedHistory} />
                  )}
                </div>
              </Panel>

              <Panel title="備註" subtitle="記錄測量前後的狀態、咖啡因、運動、睡眠等脈絡" icon={Table2}>
                <label className="mb-2 block text-xs font-bold text-slate-500">備註</label>
                <textarea
                  value={form.note}
                  onChange={(e) => setForm((prev) => ({ ...prev, note: e.target.value }))}
                  placeholder="例如：測量前剛喝咖啡、剛運動、睡眠不足……"
                  className="min-h-24 w-full rounded-2xl border border-slate-300 px-4 py-3 outline-none focus:border-orange-400"
                />
              </Panel>

              {message && (
                <div className="flex items-start gap-2 rounded-2xl bg-amber-50 p-4 text-sm text-amber-800">
                  <AlertTriangle className="mt-0.5 shrink-0" size={18} />
                  <p>{message}</p>
                </div>
              )}

              <button
                onClick={saveToGoogleSheet}
                disabled={!canSave || isSaving}
                className="flex w-full items-center justify-center gap-2 rounded-full bg-slate-900 px-6 py-4 text-lg font-bold text-white shadow-sm transition hover:bg-slate-800 disabled:bg-slate-300"
              >
                {isSaving ? <Loader2 className="animate-spin" /> : <UploadCloud />}
                儲存至 Google Sheet
              </button>

              <p className="pb-8 text-center text-xs text-slate-400">提醒：第一次使用時，Apps Script 需部署為「任何人皆可存取」。</p>
            </div>
          </div>
        );
      }

      createRoot(document.getElementById("root")).render(<HrvScreenshotUploader />);
    </script>
  </body>
</html>
